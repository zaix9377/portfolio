<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">AI 数据问题排查脱敏界面示意</title>
  <desc id="desc">展示 SQL、日志、问题描述输入和排查报告输出的脱敏界面。</desc>
  <rect width="1200" height="750" fill="#0b1220"/>
  <rect x="72" y="66" width="1056" height="618" rx="24" fill="#f8fafc"/>
  <text x="120" y="128" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700">AI 数据问题排查</text>
  <rect x="120" y="180" width="300" height="390" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="150" y="224" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">输入材料</text>
  <rect x="150" y="266" width="210" height="40" rx="12" fill="#e0f2fe"/>
  <text x="178" y="292" fill="#075985" font-family="Arial, sans-serif" font-size="18">SQL 脚本</text>
  <rect x="150" y="330" width="210" height="40" rx="12" fill="#fef3c7"/>
  <text x="178" y="356" fill="#92400e" font-family="Arial, sans-serif" font-size="18">运行日志</text>
  <rect x="150" y="394" width="210" height="40" rx="12" fill="#dcfce7"/>
  <text x="178" y="420" fill="#166534" font-family="Arial, sans-serif" font-size="18">问题描述</text>
  <rect x="470" y="180" width="280" height="390" rx="16" fill="#020617"/>
  <text x="502" y="226" fill="#67e8f9" font-family="Arial, sans-serif" font-size="22" font-weight="700">AI 分析链路</text>
  <rect x="502" y="276" width="190" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="502" y="318" width="220" height="14" rx="7" fill="#94a3b8"/>
  <rect x="502" y="360" width="170" height="14" rx="7" fill="#94a3b8"/>
  <rect x="502" y="430" width="180" height="44" rx="12" fill="#164e63"/>
  <text x="528" y="458" fill="#cffafe" font-family="Arial, sans-serif" font-size="18">排查建议</text>
  <rect x="800" y="180" width="280" height="390" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="224" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">问题分析报告</text>
  <rect x="830" y="268" width="205" height="16" rx="8" fill="#ef4444"/>
  <rect x="830" y="310" width="220" height="16" rx="8" fill="#fca5a5"/>
  <rect x="830" y="352" width="170" height="16" rx="8" fill="#cbd5e1"/>
  <rect x="830" y="422" width="190" height="48" rx="12" fill="#ecfeff"/>
  <text x="858" y="452" fill="#155e75" font-family="Arial, sans-serif" font-size="18">验证 SQL</text>
  <path d="M420 376H470M750 376H800" stroke="#0891b2" stroke-width="4" stroke-dasharray="10 8"/>
</svg>
